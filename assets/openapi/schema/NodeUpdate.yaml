type: object
description: >
  Updateable node attributes. Omitted fields are left unchanged.
  For a timeseries node, setting `metadata.resolution` (in seconds) enables
  completeness statistics and gap detection.
properties:
  display_name:
    type: string
    pattern: '^\w+$'
  kind:
    type: string
  parent_id:
    type: integer
    format: int32
  metadata:
    type: object
    description: >
      Optional arbitrary key/value metadata; a `resolution` value in seconds
      enables completeness statistics and gap detection. Properties inherited
      from an ancestor may be overridden here by sending the property without
      the `_inherited` marker. A body containing `_inherited` or `_aggregated`
      is rejected with 400, because both markers are computed on read and never
      stored. The span keys `first` and `last` are dropped, so a node's time
      span always tracks its own data.
example:
  display_name: "Temperature (10m)"
  metadata:
    resolution: 3600
    lat: 49.9
    lon: 11.5
