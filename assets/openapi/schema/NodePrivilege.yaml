type: object
required:
  - permission
description: "Exactly one of grantee_id (user) or grantee_group_id (group) must be set. node_id defaults to the node in the request path; grantor_id is derived from the authenticated user."
properties:
  id:
    readOnly: true
    type: integer
    format: int32
  node_id:
    readOnly: true
    type: integer
    format: int32
  grantee_id:
    type: integer
    format: int32
    description: Set this to grant to a specific user
  grantee_group_id:
    type: integer
    format: int32
    description: Set this to grant to all members of a user group
  grantor_id:
    readOnly: true
    type: integer
    format: int32
  permission:
    type: integer
    minimum: 1
    maximum: 7
