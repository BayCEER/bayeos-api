type: object
required:
  - grantee_id
  - grantor_id
  - permission
description: "node_id defaults to the node in the request path when creating a privilege."  
properties:
  id:
    readOnly: true
    type: integer
    format: int32          
  node_id:
    type: integer
    format: int32
  grantee_id:
    type: integer
    format: int32   
  grantor_id:
    type: integer
    format: int32   
  permission:    
    type: integer 
    minimum: 1
    maximum: 7
   
   

  