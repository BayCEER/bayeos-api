type: object
description: Updateable user attributes. Omitted fields are left unchanged.
properties:
  display_name:
    type: string
  sign_in_name:
    type: string
  email_address:
    type: string
    format: email
  super_user:
    type: boolean
  memberids:
    type: array
    items:
      type: integer
      format: int32
    description: >
      Group ids to replace the user's group memberships; super user only.