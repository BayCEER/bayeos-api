type: object
properties:
  ts:
    oneOf:
      - type: string
        format: date-time
        description: RFC3339 timestamp
      - type: integer
        format: int64
        description: Epoch microseconds
    description: Timestamp (auto-detected: string = ISO, integer = epoch µs)
  value:
    type: number
    format: float
    description: Measurement value
required:
  - ts
  - value
example:
  ts: '2026-08-31T12:34:56.789Z'
  value: 23.5