type: object
properties:
  ts:
    description: Timestamp auto-detected string = ISO, integer = epoch µs
    oneOf:
      - type: string
        format: date-time
        description: RFC3339 timestamp
      - type: integer
        format: int64
        description: Epoch microseconds
  value:
    type: number
    format: float
    description: Measurement value
  status:
    $ref: ./TimeseriesStatus.yaml
    description: >
      Optional validation status of the data point; when present it is stored
      with the point.
required:
  - ts
  - value
example:
  ts: "2026-08-31T12:34:56.789Z"
  value: 23.5
