type: object
required:
  - sign_in_name
  - display_name
  - email_address
  - password
  - super_user
properties:
  sign_in_name:
    type: string
  display_name:
    type: string
  email_address:
    type: string
    format: email
  password:
    type: string
    format: password
  super_user:
    type: boolean
    default: false

example:
  sign_in_name: "marge"
  display_name: Marge Simpson
  email_address: marge.simpson@gmail.com
  password: "marge123"
  super_user: false
