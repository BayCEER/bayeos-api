type: object
properties:
  sample_interval:
    type: string
    enum: [1h, 1d, 1M, 1y]
    description: Rollup granularity applied to the returned series; present only when sampling
  sample_func:
    type: string
    enum: [avg, count, sum, last, min, max, first]
    description: Aggregate applied within each bucket; present only when sampling
  ts_type:
    type: string
    enum: [iso, epoch]
    default: iso
    description: Timestamp encoding of the ts arrays; `iso` uses RFC3339 strings, `epoch` uses epoch microseconds
  series:
    type: array
    description: One entry per requested timeseries (readable by the caller), in request order
    items:
      type: object
      properties:
        id:
          type: integer
          format: int32
        ts:
          type: array
          items:
            oneOf:
              - type: integer
                format: int64
                description: Epoch microseconds (when ts_type is epoch)
              - type: string
                format: date-time
                description: RFC3339 timestamp (when ts_type is iso)
          description: Timestamps, parallel to values
        values:
          type: array
          items:
            type: number
            format: double
          description: Readings, parallel to ts
