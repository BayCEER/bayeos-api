type: object
properties:
  id:
    readOnly: true
    type: integer
    format: int32
  display_name:
    type: string
    pattern: '^\w+$'
  kind:
    type: string
  parent_id:
    type: integer
    format: int32
  permission:
    readOnly: true
    type: integer
    minimum: 1
    maximum: 7
  node_path:
    type: string
  metadata:
    type: object
    description: Optional arbitrary key/value metadata attached to the node
    properties:
      unit:
        type: string
        description: Physical unit of the value, e.g. "°C", "%"
      lat:
        type: number
        format: double
        description: Latitude
      lon:
        type: number
        format: double
        description: Longitude
      resolution:
        type: number
        description: Sample interval in seconds; enables completeness statistics and gap detection
    additionalProperties: true
  created_at:
    readOnly: true
    type: string
    format: date-time
example:
  id: 12
  display_name: "Springfield"
  kind: Folder
  parent_id: 10
  permission: 5
  node_path: /Users/Bart Simpson
  created_at: "2026-08-31T12:34:56.789Z"
