type: object
properties:
  id:
    readOnly: true
    type: integer
    format: int32
  display_name:
    type: string
    pattern: '^\w+$'
  kind:
    type: string
  parent_id:
    type: integer
    format: int32
  permission:
    readOnly: true
    type: integer
    minimum: 1
    maximum: 7
  node_path:
    type: string
  metadata:
    type: object
    description: Optional arbitrary key/value metadata attached to the node
    properties:
      location:
        type: object
        properties:
          lat:
            type: number
            description: Latitude in decimal degrees, e.g. 52.520008
          lon:
            type: number
            description: Longitude in decimal degrees, e.g. 13.404954
          alt:
            type: number
            description: Altitude in meters above sea level, e.g. 34.5
      unit:
        type: string
        description: Physical unit of the value, e.g. "°C", "%"
      resolution:
        type: number
        description: Sample interval in seconds; enables completeness statistics and gap detection
      first:
        type: string
        format: date-time
        readOnly: true
        description: First data point timestamp of the timeseries, rolled up from this node and its descendants by the API (ISO-8601 UTC, microsecond precision). Read-only; dropped from any write
      last:
        type: string
        format: date-time
        readOnly: true
        description: Last data point timestamp of the timeseries, rolled up from this node and its descendants by the API (ISO-8601 UTC, microsecond precision). Read-only; dropped from any write
      _inherited:
        type: array
        readOnly: true
        items:
          type: string
        description: >
          Names of the properties above that were copied in from an ancestor on
          this read. A property this node already defines is left out, because
          the value returned is the node's own. Computed on every read and never
          stored, so a request that sends this key is rejected with 400. To
          override an inherited value locally, send the property without this
          key.
      _aggregated:
        type: array
        readOnly: true
        items:
          type: string
        description: >
          Names of the properties above that the API computed by rolling this
          node's own data together with that of its descendants, currently
          first and last. Computed on every read and never stored, so a request
          that sends this key is rejected with 400, and first and last are
          dropped from any metadata write even when no marker names them.
    additionalProperties: true
  created_at:
    readOnly: true
    type: string
    format: date-time
example:
  id: 12
  display_name: "Springfield"
  kind: Folder
  parent_id: 10
  permission: 5
  node_path: /Users/Bart Simpson
  created_at: "2026-08-31T12:34:56.789Z"
