type: object
properties:
  count:
    type: integer
    description: Number of data points used
  first_ts:
    type: [string, "null"]
    format: date-time
  last_ts:
    type: [string, "null"]
    format: date-time
  min:
    type: [number, "null"]
    format: double
  max:
    type: [number, "null"]
    format: double
  mean:
    type: [number, "null"]
    format: double
  stddev:
    type: [number, "null"]
    format: double
  completeness:
    type: [object, "null"]
    description: Present only when the node metadata has a resolution value
    properties:
      expected_count:
        type: integer
      actual_count:
        type: integer
      missing_count:
        type: integer
      completeness_pct:
        type: number
        format: double
