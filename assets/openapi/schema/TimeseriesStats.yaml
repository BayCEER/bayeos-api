type: object
properties:
  count:
    type: integer
    description: Number of data points used
  first_ts:
    type: string
    format: date-time
  last_ts:
    type: string
    format: date-time
  min:
    type: number
    format: double
  max:
    type: number
    format: double
  mean:
    type: number
    format: double
  stddev:
    type: number
    format: double
    nullable: true
  completeness:
    type: object
    nullable: true
    description: Present only when the node metadata has a resolution value
    properties:
      expected_count:
        type: integer
      actual_count:
        type: integer
      missing_count:
        type: integer
      completeness_pct:
        type: number
        format: double
