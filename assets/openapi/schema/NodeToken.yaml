type: object
description: "On creation the token is generated by the server; on update only sent fields are changed."
properties:
  id:
    readOnly: true  
    type: integer
    format: int32      
  node_id:
    type: integer
    format: int32  
  display_name:
    type: string
  active:
    type: boolean
  permission:
    type: integer
    minimum: 0
    maximum: 7
    description: "Permission bitmask: 4=read, 2=write, 1=grant. Defaults to 7 (full) on creation. A token acts on its node and the whole subtree below it."
  token:
    type: string
    format: uuid
example:
  id: 10
  node_id: 1
  display_name: "sensor-token"
  active: true
  permission: 7
  token: "79a7632b-ef7c-410a-953f-dda8f80b6979"