get:
  tags:
    - "Nodes"
  summary: Get nodes
  description: Get nodes, optionally filtered by id; only readable nodes are returned
  security:
    - JWTAuth: []
  parameters:
    - name: id
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: integer
          format: int32
      description: Optional list of node ids to filter by; repeat the parameter for each id (e.g. `id=1&id=2`)

  responses:
    "200":
      description: ok
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schema/Node.yaml

    default:
      $ref: ../components/GenericError.yaml#/GenericError

post:
  tags:
    - Nodes
  summary: Create a new node
  security:
    - JWTAuth: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../schema/NodeCreate.yaml
  responses:
    "201":
      description: created
      content:
        application/json:
          schema:
            $ref: ../schema/Node.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError
