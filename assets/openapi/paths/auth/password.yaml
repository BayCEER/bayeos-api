put:
  tags:
    - "Authentication"
  description: "Set role password to a new value"
  summary: Set password
  security:
    - JWTAuth: []
  parameters: []
  requestBody:
    content:
      application/json:
        schema:
          required:
            - "name"
            - "password"
          type: "object"
          properties:
            name:
              type: string
              example: "root"
            password:
              type: string
              example: "bayeos"
              minLength: 6
  responses:
    "200":
      description: Password changed
    default:
      $ref: ../../components/GenericError.yaml#/GenericError
