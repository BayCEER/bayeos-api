get:
  summary: Get user groups
  tags:
    - "UserGroups"
  description: "Get user groups, optionally filtered by ids or display name pattern. Super users only."
  security:
    - JWTAuth: []
  parameters:
    - name: ids
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: integer
          format: int32
      description: >
        Optional comma-separated list of group ids to filter by (e.g. `ids=1,2,3`).
        When provided, `pattern`, `skip` and `limit` are ignored.
    - name: pattern
      in: query
      required: false
      schema:
        type: string
      description: Optional display name pattern
    - name: skip
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Number of rows to skip
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Maximum number of rows to return

  responses:
    "200":
      description: ok
      content:
        application/json:
          schema:
            type: object
            required:
              - total
              - hits
            properties:
              total:
                type: integer
                format: int32
                description: Total number of matching user groups
              hits:
                type: array
                items:
                  $ref: ../schema/UserGroup.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError

post:
  summary: Create a new user group
  description: Create a new user group. Super users only.
  tags:
    - "UserGroups"
  security:
    - JWTAuth: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../schema/UserGroupCreate.yaml
  responses:
    "201":
      description: created
      content:
        application/json:
          schema:
            $ref: ../schema/UserGroup.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError