parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int32
get:
  summary: Get a user image
  tags:
    - Users
  security:
    - JWTAuth: []
  responses:
    "200":
      description: OK
      content:
        image/jpeg:
          schema:
            type: string
            format: binary
    default:
      $ref: ../components/GenericError.yaml#/GenericError
post:
  summary: Upload a user image
  description: The raw image data is sent as the request body (no multipart form encoding).
  tags:
    - Users
  security:
    - JWTAuth: []
  requestBody:
    required: true
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  responses:
    "201":
      description: created
    default:
      $ref: ../components/GenericError.yaml#/GenericError
delete:
  summary: Delete a user image
  tags:
    - Users
  security:
    - JWTAuth: []
  responses:
    "200":
      description: deleted
    default:
      $ref: ../components/GenericError.yaml#/GenericError
