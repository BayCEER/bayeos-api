parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int32
patch:
  tags:
    - Timeseries
  summary: Update the status of one or more data points
  description: >
    Updates the `status` byte column of the given data points of a timeseries.
    QuestDB upserts on (id, ts), so each record must carry the ts, the value
    (preserved or re-written) and the new status.
  security:
    - JWTAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - ts
              - value
              - status
            properties:
              ts:
                type: string
                format: date-time
                description: Timestamp of the data point
              value:
                type: number
                format: float
                description: Measurement value
              status:
                $ref: ../schema/TimeseriesStatus.yaml
                description: New status byte for the data point
  responses:
    "200":
      description: updated
    default:
      $ref: ../components/GenericError.yaml#/GenericError
