post:
  tags:
    - Timeseries
  summary: Insert data points into multiple timeseries
  description: >
    Inserts data points into several timeseries in a single request using a
    compact, column-oriented body in which each series reports its id once and
    timestamps/values as parallel arrays. Every series id must be a Timeseries
    the caller may write; if any series fails the permission or kind check the
    whole request errors out and nothing is written.
  security:
    - JWTAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - series
          properties:
            series:
              type: array
              description: One entry per timeseries to write
              items:
                type: object
                required:
                  - id
                  - ts
                  - values
                properties:
                  id:
                    type: integer
                    format: int32
                    description: Timeseries node id
                  ts:
                    type: array
                    items:
                      type: string
                      format: date-time
                    description: Timestamps, parallel to values
                  values:
                    type: array
                    items:
                      type: number
                      format: double
                    description: Readings, parallel to ts
  responses:
    "201":
      description: created
    default:
      $ref: ../components/GenericError.yaml#/GenericError

get:
  tags:
    - Timeseries
  summary: Query data points of multiple timeseries
  description: >
    Fetches data from several timeseries in a single request using a compact,
    column-oriented return format in which each series reports its id once and
    timestamps/values as parallel arrays. Only timeseries the caller may read
    are returned; unknown or non-readable ids are skipped.
  security:
    - JWTAuth: []
  parameters:
    - name: ids
      in: query
      required: true
      style: form
      explode: false
      schema:
        type: array
        items:
          type: integer
          format: int32
      description: Comma-separated timeseries node ids to fetch (e.g. `ids=5,6,7`)
    - name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive lower time bound
    - name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive upper time bound
    - name: sample_interval
      in: query
      required: false
      schema:
        type: string
        enum: [1h, 1d, 1M, 1y]
      description: Rollup granularity; when set returns one sampled value per bucket
    - name: sample_func
      in: query
      required: false
      schema:
        type: string
        enum: [avg, count, sum, last, min, max, first]
        default: avg
      description: Aggregate applied within each bucket; ignored when `sample_interval` is empty
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
      description: Maximum number of data points to return per series; the most recent points are returned
    - name: ts_type
      in: query
      required: false
      schema:
        type: string
        enum: [iso, epoch]
        default: iso
      description: Timestamp encoding of the response; `iso` (default) uses RFC3339 strings, `epoch` uses epoch microseconds
  responses:
    "200":
      description: ok
      content:
        application/json:
          schema:
            $ref: ../schema/TimeseriesBatchData.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError
