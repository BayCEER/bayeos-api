parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int32
    description: node id
security:
  - JWTAuth: []
get:
  tags:
    - Nodes
  summary: Get all tokens of a node
  responses:
    "200":
      description: Array of node tokens
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schema/NodeToken.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError
post:
  summary: Create a new node token
  tags:
    - Nodes
  security:
    - JWTAuth: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../schema/NodeToken.yaml
  responses:
    "201":
      description: created
    default:
      $ref: ../components/GenericError.yaml#/GenericError
