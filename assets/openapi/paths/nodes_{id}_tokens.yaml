parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int32
    description: node id
get:
  tags:
    - Nodes
  summary: Get all tokens of a node
  security:
    - JWTAuth: []
  responses:
    "200":
      description: Array of node tokens
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schema/NodeToken.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError
post:
  summary: Create a new node token
  description: The token is generated by the server; no request body is required.
  tags:
    - Nodes
  security:
    - JWTAuth: []
  responses:
    "201":
      description: created
      content:
        application/json:
          schema:
            $ref: ../schema/NodeToken.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError
