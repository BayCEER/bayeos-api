parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int32
    description: node id
get:
  tags:
    - Nodes
  summary: Get all tokens of a node
  security:
    - JWTAuth: []
  responses:
    "200":
      description: Array of node tokens
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schema/NodeToken.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError
post:
  summary: Create a new node token
  description: The token is generated by the server. An optional body sets the token permission; omitted it defaults to 7 (full). The token is only usable by its owner through the Node-Token header.
  tags:
    - Nodes
  security:
    - JWTAuth: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            permission:
              type: integer
              minimum: 0
              maximum: 7
              description: "Permission bitmask: 4=read, 2=write, 1=grant. Defaults to 7."
  responses:
    "201":
      description: created
      content:
        application/json:
          schema:
            $ref: ../schema/NodeToken.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError
