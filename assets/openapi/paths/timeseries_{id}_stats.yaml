parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int32
get:
  tags:
    - Timeseries
  summary: Compute statistical metadata of a timeseries
  description: >
    Computes statistics (count, range, mean, stddev).
    When the node's metadata contains a `resolution` value in seconds, the
    response additionally includes completeness information derived from the
    expected sampling period.
  security:
    - JWTAuth: []
    - NodeTokenAuth: []
  parameters:
    - name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive lower time bound
    - name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive upper time bound
    - name: agg
      in: query
      required: false
      schema:
        type: string
        enum: [1h, 1d, 1M, 1y]
      description: Rollup granularity; when set computes stats on the pre-aggregated buckets
  responses:
    "200":
      description: ok
      content:
        application/json:
          schema:
            $ref: ../schema/TimeseriesStats.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError