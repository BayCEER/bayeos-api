parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int32
get:
  tags:
    - Nodes
  summary: Get a node by id
  security:
    - JWTAuth: []
    - NodeTokenAuth: []
  responses:
    "200":
      description: ok
      content:
        application/json:
          schema:
            $ref: ../schema/Node.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError

patch:
  tags:
    - Nodes
  summary: Update a node by id
  description: Partial update, only send the fields to change; omitted fields are left unchanged.
  security:
    - JWTAuth: []
    - NodeTokenAuth: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../schema/NodeUpdate.yaml
  responses:
    "200":
      description: updated
    default:
      $ref: ../components/GenericError.yaml#/GenericError

delete:
  tags:
    - Nodes
  summary: Delete a node by id
  security:
    - JWTAuth: []
    - NodeTokenAuth: []
  responses:
    "200":
      description: deleted
    default:
      $ref: ../components/GenericError.yaml#/GenericError
