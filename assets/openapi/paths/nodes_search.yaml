get:
  tags:
    - Nodes
  summary: Search nodes by Ant path pattern
  description: |
    Search nodes by matching their full path against an Ant-style glob pattern.

    **Wildcards:**

    | Pattern | Matches |
    |---------|---------|
    | `?` | Exactly one character (except `/`) |
    | `*` | Zero or more characters within a single path segment (except `/`) |
    | `**` | Zero or more full path segments (including `/`) |

    Special regex characters (`.`, `+`, `^`, `$`, `{`, `}`, `[`, `]`, `(`, `)`, `|`) are escaped automatically.

    Results are ordered by path and filtered to nodes readable by the authenticated user.

    Optionally filter by `kind` (omit to match all kinds).
  security:
    - JWTAuth: []
  parameters:
    - name: pattern
      in: query
      required: true
      description: "Ant-style path pattern"
      schema:
        type: string
      examples:
        exact:
          summary: Exact path match
          description: "Matches only the node at `/BayEOS/Home/Sensor1`"
          value: "/BayEOS/Home/Sensor1"
        single_char:
          summary: Single character wildcard (?)
          description: "`?` matches exactly one character. Matches `Sensor1`, `Sensor2`, etc. but not `Sensor10`."
          value: "/BayEOS/Home/Sensor?"
        segment_wildcard:
          summary: Segment wildcard (*)
          description: "`*` matches zero or more characters within one path segment (no `/`). Matches `Temperature_1`, `Temp`, etc."
          value: "/BayEOS/**/Temperature*"
        multi_segment:
          summary: Multi-segment wildcard (**)
          description: "`**` matches zero or more full path segments. Matches any path containing a node named `Sensor*`."
          value: "/**/Sensor*"
        multi_segment_start:
          summary: Wildcard at the start
          description: "Starts matching from any depth."
          value: "**/Sensor*"
        all_nodes:
          summary: All nodes under a path
          description: "Matches every node under `/BayEOS/Home/`."
          value: "/BayEOS/Home/**"
        everything:
          summary: Match everything
          description: "`**` alone matches all paths."
          value: "**"
        escaped_dot:
          summary: Literal dot in filename
          description: "Special characters like `.` are escaped automatically. Matches `/BayEOS/Home/test.txt`."
          value: "/BayEOS/**/test.txt"

    - name: kind
      in: query
      required: false
      schema:
        type: string
      description: "Filter by node kind (optional; omit to match all kinds)"
    - name: skip
      in: query
      required: false
      schema:
        type: integer
        format: int32
      description: "Number of rows to skip for paging (default: 0)"
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
      description: "Maximum number of rows to return (default: 10)"
  responses:
    "200":
      description: ok
      content:
        application/json:
          schema:
            $ref: ../schema/NodeSearch.yaml
    "400":
      description: bad request (missing/invalid pattern)
      $ref: ../components/GenericError.yaml#/GenericError
    default:
      $ref: ../components/GenericError.yaml#/GenericError
