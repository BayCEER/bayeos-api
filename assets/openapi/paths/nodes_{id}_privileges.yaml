parameters:
  - name: id
    in: path
    required: true
    schema:
      type: integer
      format: int32
    description: node id
get:
  tags:
    - Nodes
  summary: Get all privileges of a node
  security:
    - JWTAuth: []
  responses:
    "200":
      description: Array of node privileges
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../schema/NodePrivilege.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError
post:
  summary: Create a new node privilege
  description: "node_id is taken from the path and overrides any value in the body; grantor_id is taken from the authenticated user."
  tags:
    - Nodes
  security:
    - JWTAuth: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../schema/NodePrivilege.yaml
  responses:
    "201":
      description: created
      content:
        application/json:
          schema:
            $ref: ../schema/NodePrivilege.yaml
    default:
      $ref: ../components/GenericError.yaml#/GenericError
